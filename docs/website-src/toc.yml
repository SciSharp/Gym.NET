# The navbar. Links are relative to this file's source location (docfx resolves them before mapping website-src/ to
# the site root), so the docs pages, which live one folder up in docs/, are reached with ../.
# Environments opens the Environments page, the gallery beside the env pages' sidebar (DR-106); its href names the
# folder whose toc.yml is that sidebar, and the landing page keeps its own gallery under the video.
- name: Docs
  href: docs/
  homepage: ../README.md
- name: Environments
  href: ../environments/
  homepage: ../environments/index.md
- name: API
  href: api/
- name: Source Code
  href: https://github.com/SciSharp/Gym.NET
