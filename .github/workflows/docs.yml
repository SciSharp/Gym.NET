# Gym.NET's documentation site (https://scisharp.github.io/Gym.NET), built with DocFX from docs/docfx.json.
#
# The site is the docs/ pages (guides, architecture, release notes) under docs/, the API reference generated from the
# packages' XML documentation, and the landing page in docs/website-src: the showreel video (docs/media) and the
# 8-bit environment gallery (docs/website-src/images/envs). tools/showreel regenerates those media; this workflow only
# publishes what is committed.
#
# Pull requests build the site to catch broken docfx input; pushes to master build and deploy it to GitHub Pages. Pages
# must be enabled once in the repository's settings with "GitHub Actions" as the source.
name: Docs

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "src/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: DocFX stamps each page with its last change from git.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Pinned: the version the site was built and checked with (docfx 2.78.4).
      - name: Install DocFX
        run: dotnet tool install -g docfx --version 2.78.4

      # DocFX compiles the documented projects itself and loads Gym.NET's source generator (the [GymOptions] records,
      # the [GymTuple]/[GymDict] records and the typed info records' ToInfoCore) from the generator's Release output.
      # A clean runner has none, so DocFX reported FailedToResolveAnalyzer and every generated member then failed as
      # CS0534 (first seen on the 1.0.0+rc1 PR). Building the generator first is what DocFX itself asks for.
      - name: Build the source generator (DocFX loads it from bin/Release)
        run: dotnet build src/Gym.SourceGenerators/Gym.SourceGenerators.csproj -c Release

      - name: Build
        run: docfx docs/docfx.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/website-src/_site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
